<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="description" content="InventoryPro — GST-ready inventory, sales POS & billing management for growing businesses"/>
  <meta name="robots" content="noindex, nofollow"/>
  <!-- Security: prevent referrer leaks -->
  <meta name="referrer" content="strict-origin-when-cross-origin"/>
  <title>InventoryPro — Inventory &amp; GST Management</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#6366f1"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="InventoryPro"/>
  <link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png"/>
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
  <style>
    /* Critical first-paint inline styles — prevents flash */
    html { background: #0a0d1a; }
    #root { min-height: 100vh; display: flex; flex-direction: column; }
    /* Safe area support for notched phones */
    body { padding-env: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  </style>
</head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
