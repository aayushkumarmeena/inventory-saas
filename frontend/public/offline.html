<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>You're offline — InventoryPro</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #0a0d1a 0%, #14112c 45%, #1b1140 75%, #0a0d1a 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #f1f2f6;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 360px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 40px 32px;
    }
    .icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(99,102,241,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 24px;
    }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.5; margin: 0 0 20px; }
    button {
      padding: 10px 22px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>InventoryPro needs a connection to load your data. Check your network and try again.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
